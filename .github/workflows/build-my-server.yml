name: Build My Linux Server

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare RobustToolbox
        run: |
          cd RobustToolbox
          git fetch --depth=1
          rm -f Robust.Shared.Tests/Networking/NetEncryptionDoSTest.cs

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Content.Packaging
        run: dotnet build Content.Packaging --configuration Release --no-restore /m

      - name: Package Server (linux-x64 + hybrid-acz)
        run: dotnet run --project Content.Packaging server --platform linux-x64 --hybrid-acz

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest Server Build
          files: release/SS14.Server_linux-x64.zip
